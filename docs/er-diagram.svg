<text x="24" y="30" style="font-size:20px;font-weight:bold;text-anchor:start">MedGraph: ER diagram (Chen notation)</text>
<text x="24" y="1130" style="font-size:13px;text-anchor:start;fill:#444">Rectangle = entity, diamond = relationship, oval = attribute</text>
<text x="24" y="1150" style="font-size:13px;text-anchor:start;fill:#444">Underlined = primary key; dashed oval = derived attribute (age from dob, search_tsv generated from note text)</text>
<text x="24" y="1170" style="font-size:13px;text-anchor:start;fill:#444">USERS covers both roles (DOCTOR, ADMIN); attends / writes / issues require role = DOCTOR (trigger)</text>
